services:
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        CMD: arena-api
    environment:
      ARENA_HTTP_ADDR: ":8080"
      ARENA_DB_PATH: "/data/arena.db"
      ARENA_REDIS_ADDR: "redis:6379"
      ARENA_ADMIN_TOKEN: "${ARENA_ADMIN_TOKEN:-dev-admin-token}"
      ARENA_LOG_DIR: "/logs"
      ARENA_EXPORT_DIR: "/exports"
      ARENA_FRONTEND_ORIGIN: "http://localhost:3000"
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./exports:/exports
    ports:
      - "8080:8080"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        CMD: arena-worker
    environment:
      ARENA_DB_PATH: "/data/arena.db"
      ARENA_REDIS_ADDR: "redis:6379"
      ARENA_ADMIN_TOKEN: "${ARENA_ADMIN_TOKEN:-dev-admin-token}"
      ARENA_LOG_DIR: "/logs"
      ARENA_EXPORT_DIR: "/exports"
      ARENA_SNAPSHOT_INTERVAL: "10s"
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./exports:/exports
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      NEXT_PUBLIC_ARENA_API_BASE_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      - backend
