services:
  redis:
    image: redis:8-alpine
    env_file:
      - path: .env
        required: false
    ports:
      - "${ARENA_REDIS_BIND:-127.0.0.1}:${ARENA_REDIS_PORT:-6379}:6379"
    command: >
      sh -c 'if [ -n "$$ARENA_REDIS_PASSWORD" ]; then
        redis-server --save "" --appendonly no --requirepass "$$ARENA_REDIS_PASSWORD";
      else
        redis-server --save "" --appendonly no;
      fi'

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        CMD: arena-api
    env_file:
      - path: .env
        required: false
    environment:
      ARENA_HTTP_ADDR: ":8080"
      ARENA_DB_PATH: "/data/arena.db"
      ARENA_REDIS_ADDR: "redis:6379"
      ARENA_LOG_DIR: "/logs"
      ARENA_EXPORT_DIR: "/exports"
      POLYMARKET_PAPER_DATA_DIR: "/data/pm-trader"
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./exports:/exports
    ports:
      - "${ARENA_BACKEND_BIND:-127.0.0.1}:${ARENA_BACKEND_PORT:-8080}:8080"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        CMD: arena-worker
    env_file:
      - path: .env
        required: false
    environment:
      ARENA_DB_PATH: "/data/arena.db"
      ARENA_REDIS_ADDR: "redis:6379"
      ARENA_LOG_DIR: "/logs"
      ARENA_EXPORT_DIR: "/exports"
      POLYMARKET_PAPER_DATA_DIR: "/data/pm-trader"
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./exports:/exports
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_ARENA_API_BASE_URL: "${NEXT_PUBLIC_ARENA_API_BASE_URL:-http://localhost:8080}"
    ports:
      - "${ARENA_FRONTEND_BIND:-127.0.0.1}:${ARENA_FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
